name: CI

# The cheap tier, run on every push and pull request: Linux toolchains plus the
# MinGW cross-build. The expensive hosted runners are deliberately not here —
# native Windows bills at 2x and macOS at 10x, and a single wedged Windows job
# can hold a runner open for its whole timeout. They live in windows.yml and
# macos.yml and are triggered by hand.
#
# The run is staged through `needs:`, so the Actions graph reads left to right:
#
#   Tests                  Advanced tests                Build
#   -----                  --------------                -----
#                     ┌──▶ acceptance sweeps        ┐
#   unit + integration├──▶ ASan + UBSan             ├──▶ Linux release
#   (the fast tier)   ├──▶ hardened libstdc++       │
#                     └──▶ Clang warnings-as-errors ┘──▶ Windows (MinGW cross)
#
# The fast tier is the gate: nothing expensive starts until the sub-second cases
# pass, and no shippable binary is produced until everything does. Each job
# configures its own tree — CMake has to compile before ctest can run anything —
# so the Build stage is where artifacts come from, not where compilation starts.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One shared, cacheable location for FetchContent downloads (doctest).
  FETCHCONTENT_BASE: ${{ github.workspace }}/.deps

jobs:
  # ===========================================================================
  # Stage 1 — Tests. The whole suite except the seeded sweeps, on the debug
  # preset so assertions are live. Everything else waits on it, so a broken
  # build or an obvious regression costs one job rather than six.
  # ===========================================================================
  tests:
    name: Tests / unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-gcc-doctest-2.4.12

      - name: Configure
        run: cmake --preset debug -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset debug

      - name: Run the fast tier
        run: ctest --preset debug -LE slow --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-tests
          path: build/**/Testing/**
          if-no-files-found: ignore

  # ===========================================================================
  # Stage 2 — Advanced tests. Four independent ways of being more suspicious
  # than the fast tier: more seeds, instrumented runtimes, and a second compiler.
  # ===========================================================================

  # The seeded property sweeps and the acceptance gate. Release, because these
  # walk many generated levels and debug codegen makes that slow.
  acceptance:
    name: Advanced / acceptance sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-gcc-doctest-2.4.12

      - name: Configure
        run: cmake --preset release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset release

      - name: Run the seeded sweeps
        run: ctest --preset release -L slow --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-acceptance
          path: build/**/Testing/**
          if-no-files-found: ignore

  # The full suite under AddressSanitizer and UndefinedBehaviorSanitizer, both
  # configured by the preset to halt on the first error.
  sanitizers:
    name: Advanced / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-gcc-doctest-2.4.12

      - name: Configure
        run: cmake --preset asan-ubsan -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        run: ctest --preset asan-ubsan --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sanitizers
          path: build/**/Testing/**
          if-no-files-found: ignore

  # The standard library's own precondition checks. These catch the class of
  # undefined behaviour that a release libstdc++ silently tolerates but the MSVC
  # debug runtime aborts on — out-of-range indices, invalid iterators, reading a
  # disengaged optional — so the failure surfaces on a runner that bills at 1x
  # rather than on a native Windows one that bills at 2x and hangs on the abort.
  hardened:
    name: Advanced / hardened libstdc++
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-hardened-doctest-2.4.12

      - name: Configure
        run: >-
          cmake --preset debug
          -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}
          -DCMAKE_CXX_FLAGS="-D_GLIBCXX_DEBUG -D_GLIBCXX_ASSERTIONS"

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-hardened
          path: build/**/Testing/**
          if-no-files-found: ignore

  # A second compiler held to the warnings-as-errors policy, running the whole
  # suite so codegen differences show up as test failures rather than surprises.
  clang:
    name: Advanced / Clang warnings-as-errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-clang-doctest-2.4.12

      - name: Configure
        run: cmake --preset release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-clang
          path: build/**/Testing/**
          if-no-files-found: ignore

  # ===========================================================================
  # Stage 3 — Build. The shippable console executables, built with the tests
  # switched off, and only once every check above has passed.
  # ===========================================================================

  build-linux:
    name: Build / Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [acceptance, sanitizers, hardened, clang]
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNAM_BUILD_TESTS=OFF

      - name: Build console executable
        run: cmake --build build/linux --target nam_console -j$(nproc)

      - name: Verify the artifact is an ELF binary
        run: |
          exe=build/linux/NAM_Console/nam_console
          file "$exe"
          file "$exe" | grep -q "ELF 64-bit" || { echo "not an ELF 64-bit binary"; exit 1; }

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: nam_console-linux-x86_64
          path: build/linux/NAM_Console/nam_console
          if-no-files-found: error

  # Linux -> Windows cross-compilation with MinGW-w64: proves the console (and
  # its Windows terminal backend) builds for Windows, and that the artifact is a
  # PE executable. Complements — does not replace — the native MSVC workflow.
  build-mingw:
    name: Build / Windows (MinGW cross)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [acceptance, sanitizers, hardened, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Configure (MinGW toolchain)
        run: >-
          cmake -S . -B build/mingw
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DNAM_BUILD_TESTS=OFF

      - name: Build console executable
        run: cmake --build build/mingw --target nam_console -j$(nproc)

      - name: Verify the artifact is a Windows PE binary
        run: |
          exe=build/mingw/NAM_Console/nam_console.exe
          file "$exe"
          file "$exe" | grep -q "PE32+" || { echo "not a PE32+ binary"; exit 1; }

      - name: Upload the cross-built executable
        uses: actions/upload-artifact@v7
        with:
          name: nam_console-windows-x86_64
          path: build/mingw/NAM_Console/nam_console.exe
          if-no-files-found: error
