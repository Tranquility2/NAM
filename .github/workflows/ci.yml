name: CI

# The cheap tier, run on every push and pull request: Linux toolchains plus the
# MinGW cross-build. The expensive hosted runners are deliberately not here —
# native Windows bills at 2x and macOS at 10x, and a single wedged Windows job
# can hold a runner open for its whole timeout. They live in windows.yml and
# macos.yml and are triggered by hand.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu / GCC: the plain release build and the full test suite.
  ubuntu-gcc-release:
    name: Ubuntu GCC (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      # One shared, cacheable location for FetchContent downloads (doctest).
      FETCHCONTENT_BASE: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-doctest-2.4.12

      - name: Configure
        run: cmake --preset release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-gcc-release
          path: build/**/Testing/**
          if-no-files-found: ignore

  # Ubuntu / GCC: the same suite under AddressSanitizer and
  # UndefinedBehaviorSanitizer, both configured to halt on the first error.
  ubuntu-gcc-asan-ubsan:
    name: Ubuntu GCC (asan-ubsan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      FETCHCONTENT_BASE: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-doctest-2.4.12

      - name: Configure
        run: cmake --preset asan-ubsan -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        run: ctest --preset asan-ubsan --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-gcc-asan-ubsan
          path: build/**/Testing/**
          if-no-files-found: ignore

  # Ubuntu / Clang: warnings-as-errors and the full test suite.
  ubuntu-clang:
    name: Ubuntu Clang (release, -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      FETCHCONTENT_BASE: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-clang-doctest-2.4.12

      - name: Configure
        run: cmake --preset release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-clang
          path: build/**/Testing/**
          if-no-files-found: ignore

  # Ubuntu / GCC with the libstdc++ hardened modes: the standard library's own
  # precondition checks. These catch the class of undefined behaviour that a
  # release libstdc++ silently tolerates but the MSVC debug runtime aborts on —
  # out-of-range indices, invalid iterators, reading a disengaged optional — so
  # the failure surfaces on a cheap Linux runner instead of a native Windows one.
  ubuntu-hardened:
    name: Ubuntu GCC (hardened libstdc++)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      FETCHCONTENT_BASE: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-hardened-doctest-2.4.12

      - name: Configure
        run: >-
          cmake --preset debug
          -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE }}
          -DCMAKE_CXX_FLAGS="-D_GLIBCXX_DEBUG -D_GLIBCXX_ASSERTIONS"

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-hardened
          path: build/**/Testing/**
          if-no-files-found: ignore

  # Linux -> Windows cross-compilation with MinGW-w64: proves the console (and
  # its Windows terminal backend) builds for Windows, and that the artifact is a
  # PE executable. Complements — does not replace — the native MSVC job.
  mingw-cross:
    name: Linux MinGW cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Configure (MinGW toolchain)
        run: >-
          cmake -S . -B build/mingw
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DNAM_BUILD_TESTS=OFF

      - name: Build console executable
        run: cmake --build build/mingw --target nam_console -j$(nproc)

      - name: Verify the artifact is a Windows PE binary
        run: |
          exe=build/mingw/NAM_Console/nam_console.exe
          file "$exe"
          file "$exe" | grep -q "PE32+" || { echo "not a PE32+ binary"; exit 1; }

      - name: Upload the cross-built executable
        uses: actions/upload-artifact@v4
        with:
          name: nam_console-windows-x86_64
          path: build/mingw/NAM_Console/nam_console.exe
          if-no-files-found: error
